<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1510" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Maison Noël · The House of Christmas</title>
    <meta name="description" content="Maison Noël is French for the House of Christmas. The Hansen family wishlist workshop." />
    <meta property="og:title" content="Maison Noël · The House of Christmas" />
    <meta property="og:description" content="The Hansen family wishlist workshop." />
    <meta property="og:image" content="/img/og.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Preload the plate this visitor will actually see first (entrance or hub).
      ;(function () {
        var entered = false, quick = false
        try { entered = localStorage.getItem('mn_entered') === '1' || /[?&]hub\b/.test(location.search); quick = localStorage.getItem('mn_quick') === '1' } catch (e) {}
        if (quick) return
        var small = Math.max(innerWidth, innerHeight) * Math.min(devicePixelRatio || 1, 2) <= 700
        var l = document.createElement('link')
        l.rel = 'preload'; l.as = 'image'; l.fetchPriority = 'high'
        l.href = '/img/' + (entered ? 'interior' : 'exterior') + (small ? '-640' : '') + '.webp'
        document.head.appendChild(l)
        document.documentElement.dataset.entered = entered ? '1' : '0'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
